<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">
    <title>Eduplan</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- <header> é uma tag semãntica: ela existe especificamente para 
    marcar o cabeçalho do site.
    Class="header" conecta essa tag com o CSS -->
    <header class="header">
        <!-- Essa div é só um "envelope" interno, usado
        para limitar a largura do conteúdo e organizar
        os itens com Flexbox -->
        <div class="header-inner">
            <a href="#" class="logo">
                <img src="./assets/image.png" alt="Logo Eduplan">

                <h2 style="color: #1d4ed8;">Edu <span
                style="color: #16a34a;">Plan</span></h2>
            </a>

            <ul class="nav" id="nav">
                <li>
                    <a href="#">Início</a>
                </li>
                <li>
                    <a href="#">Recursos</a>
                </li>
                <li>
                    <a href="#">Benefícios</a>
                </li>
                <li>
                    <a href="#">Sobre</a>
                </li>
                <li>
                    <a href="#">Depoimentos</a>
                </li>
                <li>
                    <a href="#">Contato</a>
                </li>

                <!-- "li.nav-actions" é um atalho para criar a class com rapidez -->
                <li class="nav-actions"> 
                <a href="#" class="btn btn-entrar">Entrar</a>
                <a href="#" class="btn btn-cadastrar">Cadastrar</a>
                </li>
            </ul>

            <div class="actions">
                <a href="#" class="btn btn-entrar">Entrar</a>
                <a href="#" class="btn btn-cadastrar">Cadastrar</a>
            </div>

            <button class="hamburguer" id="btn-menu">☰</button>
        </div>

    </header>

    <script src="script.js"></script>
</body>
</html>
